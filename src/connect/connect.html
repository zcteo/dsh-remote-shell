<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
    <title>DeepSeek Harness</title>
    <link rel="stylesheet" href="connect.css">
    <script type="module" src="connect.js"></script>
  </head>
  <body>
    <main class="shell">
      <h1 id="heading"></h1>
      <p id="description" class="description"></p>
      <p id="notice" class="notice" hidden></p>
      <form id="form" novalidate>
        <label id="address-label" for="address"></label>
        <input id="address" name="address" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <p id="error" class="error" role="alert" hidden></p>
        <button id="submit" type="submit"></button>
      </form>
      <p id="hint" class="hint"></p>
    </main>
  </body>
</html>
